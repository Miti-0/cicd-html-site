name: Deploy Static HTML Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate index.html exists
        run: test -f index.html

      - name: Sync files using secret target directory
        env:
          DEPLOY_WEB_DIR: ${{ secrets.DEPLOY_WEB_DIR }}
        run: |
          test -n "$DEPLOY_WEB_DIR"
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'actions-runner/' \
            ./ "$DEPLOY_WEB_DIR/"

      - name: Validate Nginx config and reload
        run: sudo nginx -t && sudo systemctl reload nginx
