name: Deploy Static HTML Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate index.html exists
        run: test -f index.html

      - name: Sync files to /var/www/cicd-html/
        run: |
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'actions-runner/' \
            ./ /var/www/cicd-html/

      - name: Validate Nginx config and reload
        run: sudo nginx -t && sudo systemctl reload nginx
