name: Deploy Static HTML Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate index.html exists
        run: test -f index.html

      - name: Use DEPLOY_WEB_DIR secret
        env:
          DEPLOY_WEB_DIR: ${{ secrets.DEPLOY_WEB_DIR }}
        run: test -n "$DEPLOY_WEB_DIR"
