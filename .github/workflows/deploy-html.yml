name: Deploy Static HTML Site

on:
push:
branches:
  - main

jobs:
deploy:
runs-on: ubuntu-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Validate index.html exists
    run: test -f index.html

  - name: Configure SSH key
    run: |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -p 2222 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      chmod 644 ~/.ssh/known_hosts

  - name: Sync files to Nginx web root
    run: |
      rsync -avz --delete \
        --exclude '.git/' \
        --exclude '.github/' \
        -e "ssh -p 2222 -i ~/.ssh/id_ed25519" \
        ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/cicd-html/"

  - name: Validate and reload Nginx
    run: |
      ssh -p 2222 -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
        "sudo nginx -t && sudo systemctl reload nginx"
